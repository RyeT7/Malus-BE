name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/build

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SA_PASSWORD: CiTest${{ github.run_id }}x
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiTest${{ github.run_id }}x
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiTest${{ github.run_id }}x -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/build

      - name: Create test database
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$SA_PASSWORD" -b \
            -Q "CREATE DATABASE malus_content_test"

      - run: go test -race -count=1 ./...
        env:
          MALUS_TEST_SQL_DSN: server=localhost;port=1433;user id=sa;password=${{ env.SA_PASSWORD }};database=malus_content_test;encrypt=true;TrustServerCertificate=true

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/build

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  scan-image:
    needs: [lint, test, vulncheck]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [content, gateway, interaction, realtime, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: malus-be-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: malus-be-${{ matrix.service }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
