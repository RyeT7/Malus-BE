name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  publish-image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [content, gateway, interaction, realtime, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/malus-be-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Tag latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

  deploy:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-malus-prod
      APP_PREFIX: ca-malus-prod
      MIGRATION_JOB: caj-malus-prod-migrate
      TAG: sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/malus-be" >> "$GITHUB_ENV"

      - name: Migrate content database
        run: |
          az containerapp job update -n "$MIGRATION_JOB" -g "$RESOURCE_GROUP" \
            --container-name migrate --image "$IMAGE_PREFIX-content:$TAG" -o none
          execution=$(az containerapp job start -n "$MIGRATION_JOB" -g "$RESOURCE_GROUP" --query name -o tsv)
          for _ in $(seq 66); do
            status=$(az containerapp job execution show -n "$MIGRATION_JOB" -g "$RESOURCE_GROUP" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "$execution: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration did not finish in time"
          exit 1

      - name: Roll out services
        run: |
          for service in content interaction realtime worker gateway; do
            app="$APP_PREFIX-$service"
            az containerapp update -n "$app" -g "$RESOURCE_GROUP" \
              --container-name app --image "$IMAGE_PREFIX-$service:$TAG" -o none
            revision=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
            state=Provisioning
            for _ in $(seq 30); do
              state=$(az containerapp revision show -n "$app" -g "$RESOURCE_GROUP" --revision "$revision" \
                --query properties.provisioningState -o tsv)
              [ "$state" != "Provisioning" ] && break
              sleep 10
            done
            echo "$app: $revision $state"
            if [ "$state" != "Provisioned" ]; then
              az containerapp revision show -n "$app" -g "$RESOURCE_GROUP" --revision "$revision" \
                --query properties.provisioningError -o tsv
              exit 1
            fi
          done

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show -n "$APP_PREFIX-gateway" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for path in /healthz /v1/presentation /v1/questions /v1/live/connection; do
            echo "GET https://$fqdn$path"
            curl -fsS --retry 40 --retry-delay 10 --retry-all-errors --max-time 30 "https://$fqdn$path" > /dev/null
          done
