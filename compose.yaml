name: malus

x-sql-dsn: &sql-dsn "server=sqlserver;port=1433;user id=sa;password=${MSSQL_SA_PASSWORD:-};database=malus_content;encrypt=true;TrustServerCertificate=true"

x-azurite-connection: &azurite-connection "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

x-cosmos-emulator-key: &cosmos-emulator-key "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true

x-service: &service
  <<: *hardening
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &env
    APP_ENV: local
    LOG_LEVEL: ${LOG_LEVEL:-debug}
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    restart: unless-stopped
    environment:
      PROTOCOL: http
      GATEWAY_PUBLIC_ENDPOINT: cosmos
      ENABLE_EXPLORER: "true"
      ENABLE_TELEMETRY: "false"
    ports:
      - "18081:8081"
      - "1234:1234"
    volumes:
      - cosmos-data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -b
      - -Q
      - "IF DB_ID('malus_content') IS NULL CREATE DATABASE malus_content; IF DB_ID('malus_content_test') IS NULL CREATE DATABASE malus_content_test;"
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrate-content:
    <<: *hardening
    build:
      context: .
      args:
        SERVICE: content
    image: malus-be/content:local
    command: ["migrate"]
    environment:
      <<: *env
      SQL_DSN: *sql-dsn
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    restart: "no"

  gateway:
    <<: *service
    build:
      context: .
      args:
        SERVICE: gateway
    image: malus-be/gateway:local
    environment:
      <<: *env
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      CONTENT_URL: http://content:8080
      INTERACTION_URL: http://interaction:8080
      REALTIME_URL: http://realtime:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  content:
    <<: *service
    build:
      context: .
      args:
        SERVICE: content
    image: malus-be/content:local
    environment:
      <<: *env
      SQL_DSN: *sql-dsn
      BLOB_CONNECTION_STRING: *azurite-connection
      BLOB_PUBLIC_ENDPOINT: http://localhost:10000/devstoreaccount1
    depends_on:
      migrate-content:
        condition: service_completed_successfully
      azurite:
        condition: service_started

  interaction:
    <<: *service
    build:
      context: .
      args:
        SERVICE: interaction
    image: malus-be/interaction:local
    environment:
      <<: *env
      COSMOS_ENDPOINT: http://cosmos:8081
      COSMOS_KEY: *cosmos-emulator-key
      COSMOS_DATABASE: malus
      COSMOS_QUESTIONS_CONTAINER: questions
    depends_on:
      cosmos:
        condition: service_started

  realtime:
    <<: *service
    build:
      context: .
      args:
        SERVICE: realtime
    image: malus-be/realtime:local
    environment:
      <<: *env
      COSMOS_ENDPOINT: http://cosmos:8081
      COSMOS_KEY: *cosmos-emulator-key
      COSMOS_DATABASE: malus
      COSMOS_SESSIONS_CONTAINER: sessions
    depends_on:
      cosmos:
        condition: service_started

  worker:
    <<: *service
    build:
      context: .
      args:
        SERVICE: worker
    image: malus-be/worker:local

volumes:
  sqlserver-data:
  cosmos-data:
  azurite-data:
